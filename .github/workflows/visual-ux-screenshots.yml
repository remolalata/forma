name: Visual UX Screenshots

on:
  # Vercel supplies the deployed URL and SHA after the preview is ready.
  # This workflow must exist on the repository's default branch to receive it.
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      preview_url:
        description: "The ready Vercel preview URL (https://...)"
        required: true
        type: string
      commit_sha:
        description: "Full 40-character commit SHA deployed at this URL"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: visual-ux-${{ github.event.client_payload.git.ref || inputs.commit_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  capture-screenshots:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.environment == 'preview' &&
          github.event.client_payload.project.name == 'forma'
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve deployed preview
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            const payload = context.payload;
            const sha = (manual ? payload.inputs?.commit_sha : payload.client_payload?.git?.sha)?.trim();
            const previewUrl = (manual ? payload.inputs?.preview_url : payload.client_payload?.url)?.trim();

            if (!/^[a-f0-9]{40}$/i.test(sha ?? '')) {
              throw new Error('The preview must include its full 40-character commit SHA.');
            }

            let url;
            try {
              url = new URL(previewUrl);
            } catch {
              throw new Error('The preview must include a valid HTTPS deployment URL.');
            }
            if (url.protocol !== 'https:' || url.username || url.password) {
              throw new Error('Use an HTTPS preview URL without embedded credentials.');
            }

            core.setOutput('sha', sha);
            core.setOutput('url', url.href);
            core.info(`Capturing deployed commit ${sha} at ${url.href}`);

      # Test the exact commit Vercel deployed, rather than the default branch.
      - name: Checkout deployed code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.preview.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          mkdir -p screenshots
          npx playwright test tests/visual-review.spec.ts --workers=1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
